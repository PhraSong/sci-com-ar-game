<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Leaderboard - Sci-Com AR</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* อนิเมชันเวลารีเฟรชข้อมูล */
        .fade-in { animation: fadeIn 0.5s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-slate-900 text-white font-sans min-h-screen flex flex-col">

    <!-- ส่วนหัว (Header) -->
    <header class="bg-slate-800 p-6 shadow-lg border-b-4 border-indigo-500 flex justify-between items-center z-10">
        <div>
            <h1 class="text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-indigo-300 tracking-wider">
                🚀 MISSION LEADERBOARD
            </h1>
            <p class="text-slate-400 mt-2 text-lg">สถิติการสร้างสรรค์นวัตกรรม Sci-Com AR</p>
        </div>
        <div class="text-right">
            <div class="text-slate-300 text-sm mb-1">อัปเดตล่าสุด: <span id="lastUpdateTime" class="font-bold text-yellow-300">กำลังโหลด...</span></div>
            <div class="inline-block bg-slate-700 rounded-full px-4 py-1 text-sm text-green-400 animate-pulse">
                🟢 Live - Realtime Sync
            </div>
        </div>
    </header>

    <!-- พื้นที่แสดงรายชื่อ (Main Content) -->
    <main class="flex-grow p-8 overflow-hidden relative">
        <!-- ลายน้ำพื้นหลังให้ดูเป็นธีมวิทย์คอม -->
        <div class="absolute inset-0 opacity-5 pointer-events-none flex items-center justify-center">
            <span class="text-[20rem]">💻🔬</span>
        </div>

        <div class="max-w-6xl mx-auto relative z-10">
            <!-- หัวตาราง -->
            <div class="grid grid-cols-12 gap-4 text-slate-400 font-bold text-xl pb-4 border-b border-slate-700 mb-4 px-6">
                <div class="col-span-2 text-center">อันดับ</div>
                <div class="col-span-5">รายชื่อนักสำรวจ</div>
                <div class="col-span-2 text-center">ระดับชั้น</div>
                <div class="col-span-3 text-right">คะแนน (pt)</div>
            </div>

            <!-- กล่องใส่รายชื่อ (สร้างจาก JS) -->
            <div id="leaderboardContainer" class="space-y-3">
                <!-- แถวข้อมูลจะถูกเพิ่มตรงนี้ -->
                <div class="text-center py-10 text-2xl text-slate-500 animate-pulse">กำลังเชื่อมต่อฐานข้อมูล...</div>
            </div>
        </div>
    </main>

    <script>
        // ⚠️ วาง Web App URL จาก Google Apps Script ตรงนี้
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxv7P0EbwB-k_5KOCcH5PjzAOhAFsu1vHliCZlIiTY-mhfzO76VKhSE1aBI2_42CVrBYw/exec';
        const refreshInterval = 10000; // ตั้งเวลารีเฟรชทุกๆ 10 วินาที (10,000 ms)
        
        const container = document.getElementById('leaderboardContainer');
        const timeDisplay = document.getElementById('lastUpdateTime');

        async function fetchLeaderboard() {
            try {
                // เรียกใช้ API ด้วย action=getLeaderboard (GAS จะเรียงคะแนนจากมากไปน้อยมาให้แล้ว)
                const response = await fetch(`${SCRIPT_URL}?action=getLeaderboard`);
                const players = await response.json();
                
                renderLeaderboard(players);
                
                // อัปเดตเวลาล่าสุด
                const now = new Date();
                timeDisplay.innerText = now.toLocaleTimeString('th-TH');
            } catch (error) {
                console.error("เกิดข้อผิดพลาดในการดึงข้อมูล:", error);
                timeDisplay.innerText = "เชื่อมต่อล้มเหลว กำลังลองใหม่...";
                timeDisplay.classList.replace('text-yellow-300', 'text-red-400');
            }
        }

        function renderLeaderboard(players) {
            container.innerHTML = ''; // ล้างข้อมูลเก่า
            
            if (players.length === 0) {
                container.innerHTML = '<div class="text-center py-10 text-xl text-slate-500">ยังไม่มีผู้เล่นส่งคะแนน</div>';
                return;
            }

            players.forEach((player, index) => {
                const rank = index + 1;
                const isTop3 = rank <= 3;
                
                // ออกแบบสีพิเศษสำหรับ Top 3 (ทอง, เงิน, ทองแดง)
                let rankStyle = "bg-slate-700 text-slate-300";
                let rowStyle = "bg-slate-800/80 border-slate-700";
                
                if (rank === 1) { rankStyle = "bg-yellow-400 text-yellow-900 shadow-[0_0_15px_rgba(250,204,21,0.5)]"; rowStyle = "bg-yellow-900/20 border-yellow-500/50"; }
                else if (rank === 2) { rankStyle = "bg-slate-300 text-slate-800 shadow-[0_0_15px_rgba(203,213,225,0.5)]"; rowStyle = "bg-slate-700/50 border-slate-400/50"; }
                else if (rank === 3) { rankStyle = "bg-orange-400 text-orange-950 shadow-[0_0_15px_rgba(251,146,60,0.5)]"; rowStyle = "bg-orange-900/20 border-orange-500/50"; }

                const row = document.createElement('div');
                // เพิ่มคลาส fade-in เพื่อให้มีอนิเมชันเวลาอันดับเปลี่ยน
                row.className = `grid grid-cols-12 gap-4 items-center p-4 rounded-xl border ${rowStyle} fade-in transition-all duration-500 hover:scale-[1.01]`;
                
                row.innerHTML = `
                    <div class="col-span-2 flex justify-center">
                        <div class="w-12 h-12 flex items-center justify-center rounded-full text-2xl font-black ${rankStyle}">
                            ${rank}
                        </div>
                    </div>
                    <div class="col-span-5 text-2xl font-bold ${isTop3 ? 'text-white' : 'text-slate-300'}">
                        ${player.Name} 
                        ${rank === 1 ? '👑' : ''}
                    </div>
                    <div class="col-span-2 text-center text-xl text-slate-400">
                        ${player.Class}
                    </div>
                    <div class="col-span-3 text-right text-3xl font-black ${isTop3 ? 'text-yellow-400' : 'text-indigo-400'}">
                        ${player.Total_Score.toLocaleString()}
                    </div>
                `;
                container.appendChild(row);
            });
        }

        // ดึงข้อมูลครั้งแรกทันทีที่เปิดหน้าเว็บ
        fetchLeaderboard();

        // ตั้งเวลาให้ดึงข้อมูลซ้ำแบบอัตโนมัติ
        setInterval(fetchLeaderboard, refreshInterval);
    </script>
</body>
</html>
