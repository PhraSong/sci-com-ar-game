<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sci-Com AR - HIGH SCORES</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-mono antialiased min-h-screen flex flex-col items-center p-4 sm:p-8 relative overflow-hidden">
    
    <!-- พื้นหลังตาราง Grid สไตล์ Retro -->
    <div class="absolute inset-0 bg-[linear-gradient(transparent_95%,#334155_100%),linear-gradient(90deg,transparent_95%,#334155_100%)] bg-[length:40px_40px] opacity-20 pointer-events-none"></div>

    <!-- หัวข้อหน้าจอ -->
    <h1 class="text-5xl sm:text-7xl font-black text-center text-transparent bg-clip-text bg-gradient-to-b from-yellow-300 to-orange-600 mb-2 mt-4 tracking-widest relative z-10" style="text-shadow: 4px 4px 0px rgba(0,0,0,0.8);">
        HIGH SCORES
    </h1>
    <p class="text-green-400 animate-pulse mb-8 relative z-10">> AUTO UPDATE EVERY 15 SECONDS_</p>

    <!-- สถานะกำลังโหลด -->
    <div id="loading" class="text-2xl font-bold text-blue-400 animate-bounce mt-10">LOADING DATA...</div>

    <!-- คอนเทนเนอร์จัดอันดับ -->
    <div id="leaderboardContainer" class="w-full max-w-3xl hidden flex-col relative z-10">
        <!-- ตารางแสดงผลทุกคนเรียงเป็นแถวแนวนอน -->
        <div class="bg-slate-800 border-4 border-blue-500 p-1 sm:p-4 shadow-[8px_8px_0px_0px_rgba(59,130,246,0.8)]">
            <table class="w-full text-left border-collapse">
                <thead class="text-blue-300 border-b-4 border-slate-600 text-sm sm:text-base">
                    <tr>
                        <th class="py-3 px-2 w-16 text-center">RANK</th>
                        <th class="py-3 px-2">PLAYER</th>
                        <th class="py-3 px-2 hidden sm:table-cell">CLASS</th>
                        <th class="py-3 px-2 text-right">SCORE</th>
                    </tr>
                </thead>
                <tbody id="rankList" class="text-sm sm:text-lg">
                    <!-- โค้ด JS จะใส่ข้อมูลตารางตรงนี้ -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- ปุ่มกลับไปหน้าเกม -->
    <button onclick="window.location.href='index.html'" class="mt-12 mb-8 bg-blue-600 hover:bg-blue-500 text-white font-bold py-4 px-8 border-b-4 border-blue-800 active:border-b-0 active:translate-y-1 transition-all text-xl shadow-[4px_4px_0px_0px_rgba(0,0,0,0.5)] relative z-10">
        [ RETURN TO GAME ]
    </button>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxv7P0EbwB-k_5KOCcH5PjzAOhAFsu1vHliCZlIiTY-mhfzO76VKhSE1aBI2_42CVrBYw/exec';
        
        // ฟังก์ชันดึงข้อมูล
        async function fetchLeaderboard() {
            try {
                const response = await fetch(`${SCRIPT_URL}?action=getLeaderboard`);
                const players = await response.json();
                renderLeaderboard(players);
            } catch (error) {
                console.error("Error fetching leaderboard:", error);
            }
        }

        // ฟังก์ชันวาดหน้าจอ
        function renderLeaderboard(players) {
            document.getElementById('loading').classList.add('hidden');
            document.getElementById('leaderboardContainer').classList.remove('hidden');
            document.getElementById('leaderboardContainer').classList.add('flex');

            const rankList = document.getElementById('rankList');
            rankList.innerHTML = '';

            if (!players || players.length === 0) {
                rankList.innerHTML = '<tr><td colspan="4" class="text-center py-8 text-slate-500">> NO DATA FOUND_</td></tr>';
                return;
            }

            // --- สร้างตารางอันดับทุกคน (อันดับ 1-3 จะมีแถบสีพิเศษ) ---
            for (let i = 0; i < players.length; i++) {
                const p = players[i];
                const row = document.createElement('tr');
                
                // ตัวแปรสำหรับปรับแต่งสีแต่ละอันดับ
                let rowStyle = "border-b-2 border-slate-700 hover:bg-slate-700 transition-colors";
                let rankColor = "text-slate-400";
                let nameColor = "text-green-400";
                let scoreColor = "text-yellow-400";

                // ใส่แถบสีสวยๆ ให้อันดับ 1 ถึง 3
                if (i === 0) { // 🥇 อันดับ 1 (ทอง)
                    rowStyle = "bg-yellow-900/40 border-l-4 border-b-4 border-yellow-400 shadow-[inset_0_0_15px_rgba(253,224,71,0.2)] hover:bg-yellow-900/60";
                    rankColor = "text-yellow-400 text-xl font-black";
                    nameColor = "text-yellow-300 text-xl";
                    scoreColor = "text-yellow-300 text-xl";
                } 
                else if (i === 1) { // 🥈 อันดับ 2 (เงิน)
                    rowStyle = "bg-slate-600/50 border-l-4 border-b-4 border-slate-300 shadow-[inset_0_0_15px_rgba(203,213,225,0.1)] hover:bg-slate-600/70";
                    rankColor = "text-slate-300 text-lg font-black";
                    nameColor = "text-white text-lg";
                    scoreColor = "text-slate-200 text-lg";
                } 
                else if (i === 2) { // 🥉 อันดับ 3 (ทองแดง)
                    rowStyle = "bg-orange-900/40 border-l-4 border-b-4 border-orange-500 shadow-[inset_0_0_15px_rgba(249,115,22,0.2)] hover:bg-orange-900/60";
                    rankColor = "text-orange-500 text-lg font-black";
                    nameColor = "text-orange-300 text-lg";
                    scoreColor = "text-orange-400 text-lg";
                }

                row.className = rowStyle;
                row.innerHTML = `
                    <td class="py-4 px-2 text-center font-bold ${rankColor}">#${i + 1}</td>
                    <td class="py-4 px-2 font-bold ${nameColor}">${p.Name || 'Unknown'}</td>
                    <td class="py-4 px-2 text-slate-400 hidden sm:table-cell">${p.Class || '-'}</td>
                    <td class="py-4 px-2 text-right font-black ${scoreColor}">${p.Total_Score || 0}</td>
                `;
                rankList.appendChild(row);
            }
        }

        // โหลดข้อมูลครั้งแรกทันทีที่เปิดหน้าเว็บ
        fetchLeaderboard();

        // ตั้งเวลาให้รีเฟรชข้อมูลอัตโนมัติทุกๆ 15 วินาที
        setInterval(fetchLeaderboard, 15000);
    </script>
</body>
</html>
